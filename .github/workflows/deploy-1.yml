name: Deploy kumanda worker

on:
  push:
    branches: [main]
    paths:
      - 'kumanda-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrangler deploy (Durable Object migration dahil)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: kumanda-worker
          wranglerVersion: "4"
          command: deploy src/index.js
